# ---------- B · 官方，但当 B 或只进「另议」；不得单独作为改技能依据 ----------
layer_b:
  - id: press_live
    layer: B
    kind: column
    title: 新闻 · 图文直播（例行新闻发布会）
    url: https://www.cnipa.gov.cn/col/col226/index.html
    track: 程序通识
    topics: [审查工具]
    note: 条法司 / 审查业务管理部答记者问须能对到原话；解读非条文。
  - id: press_desk
    layer: B
    kind: column
    title: 新闻发布（新闻发言人页）
    url: https://www.cnipa.gov.cn/col/col2486/index.html
    track: 程序通识
    topics: [审查工具]
  - id: moj_regs_qa
    layer: B
    kind: document
    title: 司法部、国知局负责人就修改专利法实施细则答记者问
    url: https://www.moj.gov.cn/pub/sfbgw/zcjd/202312/t20231221_492075.html
    track: 程序通识
    topics: [专利法与实施细则]
    note: 修订说明 / 答问，不是细则正文。
  - id: reexam_top10
    layer: B
    kind: column
    title: 复审无效十大案件（典型案例）
    url: https://www.cnipa.gov.cn/col/col2648/index.html
    track: 程序通识
    topics: [创造性叙事, 实用新型明显创造性, 局部外观与GUI]
    note: 典型案例阐释标准，不能代替指南条文单独改技能。
  - id: ipc_court
    layer: B
    kind: column
    title: 最高人民法院知识产权法庭
    url: https://ipc.court.gov.cn/zh-cn/index
    track: 程序通识
    topics: [创造性叙事, 实用新型明显创造性]
    note: 司法口径 ≠ 审查指南。指导性案例 / 司法解释 / 年度白皮书只作对照，默认进另议。

# ---------- 另议（不设全国硬种子） ----------
# 各地知识产权保护中心预审须知：只影响预审格式时写入简报「另议」，不要写成全国交底硬性要求。
# 不要把 WIPO / USPTO / EPO、需登录检索站、代办处地址类公告默认当 A。

# 施行日历样板（简报 §2 必填；以当次打开的局令列表为准，不要只抄本条）。
# 第84号：2025-11-13 公布，2026-01-01 施行。简报日已过施行日 → 可作为交底硬性要求；未到则只入日历。
calendar_examples:
  - id: order_84
    title: 国家知识产权局关于修改《专利审查指南》的决定（局令第84号）
    published_on: 2025-11-13
    effective_on: 2026-01-01
    source_ids: [guide_amend_84, guide_amend_84_gov]

