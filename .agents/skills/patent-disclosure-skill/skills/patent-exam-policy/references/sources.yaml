# 政策简报官方种子（给人打开，不是爬虫清单）。
# 优先栏目首页；正文用当次最终 URL。WAF 挡住就记失败，不要假装读过。
# layer: A = 可进主表、可支撑「对交底写法」；B = 官方但不得单独作为改技能依据；另议 = 只记、不写成全国交底硬性要求。
# kind: column = 列表首页（每趟必开）；document = 现行文本锚点（核现行有效全文时打开）。

# ---------- A · 栏目（先开这些列表） ----------
columns:
  - id: dept_rules
    layer: A
    kind: column
    title: 部门规章（局令）
    url: https://www.cnipa.gov.cn/col/col99/index.html
    track: 程序通识
    topics: [专利法与实施细则, 实用新型明显创造性, 局部外观与GUI, 相似外观]
  - id: policy_explain
    layer: A
    kind: column
    title: 政策解读
    url: https://www.cnipa.gov.cn/col/col66/index.html
    track: 申请客体
    topics: [充分公开, 申请客体, 实用新型明显创造性, 局部外观与GUI]
  - id: notices
    layer: A
    kind: column
    title: 通知（政策文件）
    url: https://www.cnipa.gov.cn/col/col75/index.html
    track: 程序通识
    topics: [专利法与实施细则]
  - id: announcements
    layer: A
    kind: column
    title: 公告（政策文件）
    url: https://www.cnipa.gov.cn/col/col74/index.html
    track: 程序通识
    topics: [专利法与实施细则]
  - id: patent_law_col
    layer: A
    kind: column
    title: 法律法规 · 专利 · 法律
    url: https://www.cnipa.gov.cn/col/col97/index.html
    track: 程序通识
    topics: [专利法与实施细则, 局部外观与GUI]
  - id: admin_regs_col
    layer: A
    kind: column
    title: 法律法规 · 专利 · 行政法规
    url: https://www.cnipa.gov.cn/col/col98/index.html
    track: 程序通识
    topics: [专利法与实施细则, 局部外观与GUI]
  - id: guide_qna
    layer: A
    kind: column
    title: 你问我答（指南修改解读，含局部外观 / GUI）
    url: https://www.cnipa.gov.cn/col/col2199/index.html
    track: 外观设计
    topics: [局部外观与GUI, 相似外观, 外观设计要点]

# ---------- A · 现行文本锚点（核全文 / 施行日时打开，勿当唯一列表源） ----------
documents:
