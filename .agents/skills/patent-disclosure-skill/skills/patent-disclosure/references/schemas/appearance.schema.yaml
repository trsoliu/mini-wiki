# AppearanceSchema — 外观设计事实合同

用于外观设计交底。入文以同目录 `figure_plan.yaml` 为准。

```yaml
$schema: appearance.schema
version: 1
mode: disclosure
source_images: []          # 看过的图；入文以 figure_plan 为准
product_name: ""
overall_shape: ""      # 整体造型一句话
product_form: solid    # solid 立体产品 | planar 平面产品；先判此项再选正投影
claimed_faces: []      # 设计要点落面。立体：主视图/后视图/左视图/右视图/俯视图/仰视图；平面：正面/背面
omitted_views:         # 故意不交的正投影（相同/对称/无要点），供简要说明；不是缺材料
  - name: ""           # 如 仰视图
    reason: ""         # 如 底面无设计要点
line_scope:            # 虚线范围锁定；出线稿前必填。改锁定表后再改图
  claimed: []          # 实线：主张保护的造型部位
  unclaimed: []        # 虚线：不主张的环境/边界；可空 = 全部可见轮廓为实线
  by_view:             # 各视复核，须与上表同一口径；未填则检查清单记待核
    - name: 主视图
      claimed: []
      unclaimed: []
views:                 # 已见且拟用的视图（含立体图）；勿为 omitted 面凑条目
  - name: 立体图       # 主视图/俯视图/左视图/立体图 等官方全称
    notes: ""
    source_image: ""   # 可选；对应材料图路径
    # 视图间关联优先写在 figure_plan.relates_to（same_state / alternate_view）
ornament: []           # 图案、线条、纹理
color: []              # 色彩搭配；不明则 uncertain
design_points: []      # 欲强调的外观要点
contrast_to_prior: []  # 与常见外观差异（假设须标）
uncertain: []          # 材料看不清，或要点落面缺少可用源图（非故意省略）
not_design_signals: [] # 若更像结构功能/方法，列于此
```

## 正投影怎么定（审查指南 4.2；交底出图即按此清单）

1. 先判 `product_form`。  
2. 按 `design_points` 列出 `claimed_faces`。  
3. 正投影清单 = 要点落面；立体产品宜加立体图。**仅当要点涉及六个面**才收齐六面正投影。平面产品一面或两面即可。  
4. 相同、对称或看不到要点的面写入 `omitted_views`（成文简要说明照抄），**不要**标成缺六视、**不要**为这些面生线稿。  
5. 要点落面没有源图 → `uncertain`，与故意省略分开。
6. 出线稿前锁定 `line_scope`（实线主张 / 虚线不主张）。无虚线部位则 `unclaimed: []`。

## 必填

- `overall_shape`  
- `views`（可空数组但须在 `uncertain` 说明缺图）  
- `uncertain`  
- `product_form`、`claimed_faces`（可空则须在 `omitted_views` 或 `uncertain` 说明）
- `line_scope.claimed`（可空数组但键须存在；与 `unclaimed` 不得列出同一部位）
