# 申请文件 · 宣传性措辞词库
#
# 权要 `audit_claims.py` 与摘要 `check_support.py` 共用。增删词条即可，不必改脚本。
# 匹配为子串（已转义），较长词优先。
#
# 只收完整搭配，不收「提高」「有效」「先进」「优选」：
# - 「优选 / 优选地 / 最优选」是说明书常规用语
# - 「最佳实施方式」是说明书固定小标题（故不用单写「最佳」扫全文）
# - 「先进先出」是 FIFO，不是宣传语
# 权要和摘要里仍拦截「最佳」「最优」（几乎不该出现）。

