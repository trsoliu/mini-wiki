[project]
name = "mini-wiki"
version = "3.3.0"
description = "AI Agent skill package for automatic project documentation generation"
authors = [
    { name = "trsoliu" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "click>=8.1",
    "pathspec>=0.12",
    "rich>=13.0",
    "tomli>=2.0; python_version<'3.11'",
]

[project.scripts]
mini-wiki = "cli:main"

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = [
    "analyze_project",
    "check_quality",
    "cli",
    "detect_changes",
    "extract_docs",
    "generate_diagram",
    "generate_toc",
    "init_wiki",
    "plugin_manager",
]

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["mini_wiki_core*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5.0",
    "types-PyYAML",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "RUF001",  # Intentional Chinese punctuation in user-facing strings
    "RUF002",  # Intentional Chinese punctuation in docstrings
    "RUF003",  # Intentional Chinese punctuation in comments
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
