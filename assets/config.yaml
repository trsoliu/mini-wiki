# Mini-Wiki 3.3 configuration template
schema_version: 3

vault:
  path: wiki
  link_style: wikilink
  source_links: relative-markdown
  preserve_manual_content: true

generation:
  language: zh
  include_diagrams: true
  include_examples: true
  max_file_size: 100000

scan:
  respect_gitignore: true
  exclude:
    - .git
    - .mini-wiki
    - .agents
    - .agent
    - node_modules
    - dist
    - build
    - coverage
    - __pycache__
    - .venv
    - venv

search:
  enabled: true
  index_code_symbols: true

bases:
  enabled: true

canvas:
  enabled: true
  max_nodes: 200

obsidian:
  integration: auto
